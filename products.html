<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Collections - Luxury Store</title>
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body>
    <!-- Header (same as index.html) -->
    <header class="header">
        <div class="container">
            <div class="nav-wrapper">
                <div class="logo">
                    <h1>LUXURY STORE</h1>
                </div>
                <nav class="nav-menu">
                    <a href="index.html">Home</a>
                    <a href="products.html">Collections</a>
                    <a href="#about">About</a>
                    <a href="#contact">Contact</a>
                </nav>
                <div class="nav-icons">
                    <a href="cart.html" class="cart-icon">
                        <i class="fas fa-shopping-bag"></i>
                        <span class="cart-count">0</span>
                    </a>
                </div>
            </div>
        </div>
    </header>

    <!-- Products Section -->
    <section class="products-section">
        <div class="container">
            <div class="products-header">
                <h1>Our Collection</h1>
                <div class="filters">
                    <select id="category-filter">
                        <option value="all">All Categories</option>
                        <option value="bags">Bags</option>
                        <option value="watches">Watches</option>
                        <option value="shoes">Shoes</option>
                        <option value="accessories">Accessories</option>
                    </select>
                    <select id="sort-filter">
                        <option value="default">Sort By</option>
                        <option value="price-low">Price: Low to High</option>
                        <option value="price-high">Price: High to Low</option>
                        <option value="name">Name</option>
                    </select>
                </div>
            </div>
            <div class="products-grid" id="all-products">
                <!-- Products will be loaded dynamically -->
            </div>
        </div>
    </section>

    <footer class="footer">
        <div class="container">
            <p class="copyright">© 2024 Luxury Store. All Rights Reserved.</p>
        </div>
    </footer>

    <a href="https://wa.me/91XXXXXXXXXX" class="whatsapp-float" target="_blank">
        <i class="fab fa-whatsapp"></i>
    </a>

    <script src="js/main.js"></script>
</body>
</html>
